<!-- 
  Email Capture Widget — Insert into blog template or index.html
  
  Uses Buttondown (free tier: 100 subscribers, unlimited emails)
  Alternative: Substack (free, takes 10% of paid subs)
  
  Setup:
  1. Create account at buttondown.email (free)
  2. Replace BUTTONDOWN_USERNAME below
  3. Add this HTML before </body> in blog-renderer.js template
-->
<div id="email-capture-widget" style="
  position:fixed;bottom:20px;right:20px;z-index:9999;
  max-width:380px;width:calc(100vw - 40px);
  background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);
  border-radius:16px;padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.08);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:none;animation:slideUp 0.4s ease;
">
  <button onclick="closeEmailWidget()" style="
    position:absolute;top:8px;right:12px;background:none;border:none;
    color:#9ca3af;font-size:20px;cursor:pointer;padding:4px 8px;
  ">&times;</button>
  
  <div style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">📬</div>
    <h3 style="color:#f9fafb;font-size:1.1rem;margin:0 0 6px;font-weight:600;">
      Get Weekly YouTube SEO Tips
    </h3>
    <p style="color:#a5b4fc;font-size:0.85rem;margin:0 0 16px;line-height:1.4;">
      Join 500+ creators getting algorithm updates, keyword trends, and growth strategies every Tuesday.
    </p>
    
    <form action="https://buttondown.email/api/emails/embed-subscribe/BUTTONDOWN_USERNAME" 
          method="post" target="popupwindow"
          onsubmit="window.open('https://buttondown.email/BUTTONDOWN_USERNAME', 'popupwindow', 'scrollbars=yes,width=800,height=600');return true"
          style="display:flex;gap:8px;">
      <input type="email" name="email" placeholder="your@email.com" required style="
        flex:1;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);
        background:rgba(255,255,255,0.08);color:#f9fafb;font-size:0.9rem;
        outline:none;transition:border-color 0.2s;
      " onfocus="this.style.borderColor='rgba(99,102,241,0.5)'" 
        onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
      <button type="submit" style="
        padding:10px 20px;border-radius:8px;border:none;
        background:#6366f1;color:white;font-weight:600;font-size:0.85rem;
        cursor:pointer;transition:background 0.2s;white-space:nowrap;
      " onmouseover="this.style.background='#4f46e5'" 
        onmouseout="this.style.background='#6366f1'">
        Subscribe
      </button>
    </form>
    
    <p style="color:#6b7280;font-size:0.7rem;margin:10px 0 0;">
      No spam. Unsubscribe anytime. We respect your inbox.
    </p>
  </div>
</div>

<style>
  @keyframes slideUp {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }
</style>

<script>
(function() {
  const KEY = 'email_widget_dismissed';
  const DELAY = 15000; // Show after 15 seconds
  const FREQUENCY = 7; // Don't show again for 7 days
  
  // Check if dismissed recently
  const dismissed = localStorage.getItem(KEY);
  if (dismissed) {
    const daysSince = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60 * 24);
    if (daysSince < FREQUENCY) return;
  }
  
  // Only show on blog posts
  if (!window.location.pathname.startsWith('/blog/')) return;
  
  // Show after delay
  setTimeout(() => {
    document.getElementById('email-capture-widget').style.display = 'block';
  }, DELAY);
  
  // Also show on scroll (if not already shown)
  let shown = false;
  window.addEventListener('scroll', function() {
    if (shown) return;
    const scrollPercent = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
    if (scrollPercent > 60) {
      shown = true;
      document.getElementById('email-capture-widget').style.display = 'block';
    }
  }, { passive: true });
})();

function closeEmailWidget() {
  document.getElementById('email-capture-widget').style.display = 'none';
  localStorage.setItem('email_widget_dismissed', Date.now().toString());
}
</script>
