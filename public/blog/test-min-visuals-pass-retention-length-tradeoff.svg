<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative example: as video length rises, retention percentage falls but total watch time delivered rises">
  <rect width="560" height="300" rx="12" fill="#0f0c29"/>
  <text x="280" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e0e7ff">Length vs retention vs watch time</text>
  <text x="280" y="46" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#8b8b9e">Illustrative example values — retention falls, watch time grows</text>

  <!-- axes -->
  <line x1="70" y1="230" x2="540" y2="230" stroke="#2d2a5e" stroke-width="1.5"/>
  <line x1="70" y1="230" x2="70" y2="60" stroke="#2d2a5e" stroke-width="1.5"/>

  <!-- x labels -->
  <text x="118" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b8b9e">3 min</text>
  <text x="225" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b8b9e">5 min</text>
  <text x="333" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b8b9e">10 min</text>
  <text x="440" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b8b9e">15 min</text>
  <text x="470" y="272" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b6b80">video length →</text>

  <!-- retention line (green): 60,55,50,45 -> y = 230 - (v*1.6) -->
  <!-- y: 60->134, 55->142, 50->150, 45->158 -->
  <polyline points="118,134 225,142 333,150 440,158" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="118" cy="134" r="4" fill="#4ade80"/>
  <circle cx="225" cy="142" r="4" fill="#4ade80"/>
  <circle cx="333" cy="150" r="4" fill="#4ade80"/>
  <circle cx="440" cy="158" r="4" fill="#4ade80"/>
  <text x="360" y="128" font-family="sans-serif" font-size="10" font-weight="700" fill="#4ade80">retention %</text>

  <!-- watch time line (orange): 1.8,2.75,5.0,6.75 -> y = 230 - (v*20) -->
  <!-- y: 1.8->194, 2.75->175, 5->130, 6.75->95 -->
  <polyline points="118,194 225,175 333,130 440,95" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="118" cy="194" r="4" fill="#fb923c"/>
  <circle cx="225" cy="175" r="4" fill="#fb923c"/>
  <circle cx="333" cy="130" r="4" fill="#fb923c"/>
  <circle cx="440" cy="95" r="4" fill="#fb923c"/>
  <text x="332" y="84" font-family="sans-serif" font-size="10" font-weight="700" fill="#fb923c">watch time min</text>

  <text x="280" y="290" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#6b6b80">Example values for illustration — not measured data · YT SEO Architect, 2026</text>
</svg>
