<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="100" fill="#09090b" rx="0"/>

  <!-- Icon -->
  <rect x="20" y="26" width="48" height="48" rx="12" fill="url(#iconBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Play triangle -->
  <polygon points="40,38 40,62 58,50" fill="#00d4ff"/>

  <!-- Magnifying glass -->
  <circle cx="56" cy="38" r="7" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <line x1="60.5" y1="42.5" x2="64" y2="46" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Score bar inside icon -->
  <rect x="26" y="65" width="36" height="2" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="26" y="65" width="26" height="2" rx="1" fill="#00d4ff" opacity="0.4"/>

  <!-- Text -->
  <text x="84" y="52" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-1">
    <tspan fill="#ff0000">YT</tspan><tspan fill="#f4f4f5">SEO</tspan>
  </text>
  <text x="84" y="74" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#00d4ff" letter-spacing="-0.5">Architect</text>
  <text x="84" y="84" font-family="Inter, system-ui, sans-serif" font-size="7" font-weight="600" fill="#52525b" letter-spacing="2" text-transform="uppercase">BUILD RANKINGS</text>
</svg>
