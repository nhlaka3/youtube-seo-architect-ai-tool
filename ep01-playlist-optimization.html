// Caption system driven by narration sentences (Phase 4)
const captionEl=document.getElementById('caption');
let currentSentenceIdx=-1;
function updateCaptionFromAudio(t){
  // Find current sentence (optimized: search forward from cached index)
  let idx=-1;
  if(currentSentenceIdx>=0&&currentSentenceIdx<narrationSentences.length-1&&t>=narrationSentences[currentSentenceIdx][0]&&(currentSentenceIdx===narrationSentences.length-1||t<narrationSentences[currentSentenceIdx+1][0])){
    idx=currentSentenceIdx;
  }else{
    // Binary search for efficiency
    let lo=0,hi=narrationSentences.length-1;
    while(lo<=hi){const mid=(lo+hi)>>1;if(narrationSentences[mid][0]<=t){idx=mid;lo=mid+1}else{hi=mid-1}}
  }
  if(idx===currentSentenceIdx)return;
  currentSentenceIdx=idx;
  if(idx<0){captionEl.innerHTML='';return}
  const text=narrationSentences[idx][1];
  // Highlight ALL matching keywords (not just first)
  const hlWords=['optimization','2026','organizing','session','depth','clicks','playlist',
    '5X','revenue','mechanisms','binge','authority','flywheel','search','mistakes',
    'keywords','thumbnails','public','cross','fix','340','2x','280','30-50','300%',
    'subscribe','mastery','myth','engineering','leverage','first movers','wide open'];
  let highlighted=text;
  for(const hw of hlWords){
    const re=new RegExp(`(${hw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
    highlighted=highlighted.replace(re,'<span class="hl">$1</span>');
  }
  captionEl.innerHTML=highlighted;
}

// ── Drawing primitives ──
function ease(t){return t<.5?2*t*t:-1+(4-2*t)*t}
function easeO(t){return 1-Math.pow(1-t,3)}
function easeB(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function drawBg(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H)}
function txt(text,x,y,o={}){
  ctx.save();ctx.font=`${o.w||'400'} ${o.s||16}px ${o.f||"'Segoe UI',system-ui,sans-serif"}`;
  ctx.fillStyle=o.c||TX;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';
  if(o.sh){ctx.shadowColor='rgba(0,242,255,.15)';ctx.shadowBlur=8}
  ctx.fillText(text,x,y);ctx.restore();
}
function rrect(x,y,w,h,r,f,s,sw){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(f){ctx.fillStyle=f;ctx.fill()}
  if(s){ctx.strokeStyle=s;ctx.lineWidth=sw||2;ctx.stroke()}
}
function line(x1,y1,x2,y2,c,lw,a){ctx.save();ctx.globalAlpha=a||1;ctx.strokeStyle=c;ctx.lineWidth=lw||2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function dot(cx,cy,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill()}
function circ(cx,cy,r,f,s,sw){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=sw||2;ctx.stroke()}}
function arrow(x1,y1,x2,y2,c,lw){
  ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=lw||2;
  const a=Math.atan2(y2-y1,x2-x1),l=8;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-l*Math.cos(a-.5),y2-l*Math.sin(a-.5));ctx.lineTo(x2-l*Math.cos(a+.5),y2-l*Math.sin(a+.5));ctx.closePath();ctx.fill();ctx.restore();
}
function meter(x,y,w,h,p,c){
  rrect(x,y,w,h,4,null,MU+'30',1);
  ctx.save();ctx.beginPath();ctx.roundRect(x,y,w*p,h,4);ctx.fillStyle=c;ctx.globalAlpha=.5;ctx.fill();ctx.restore();
}
function glow(cx,cy,r,c){ctx.save();ctx.globalAlpha=.2;ctx.shadowColor=c;ctx.shadowBlur=r;circ(cx,cy,r*.3,c+'40',null);ctx.restore()}

// ── Camera system (Layer 5) ──
let cam={x:0,y:0,scale:1,target:{x:0,y:0,s:1}};
function camUpdate(){cam.x=lerp(cam.x,cam.target.x,.08);cam.y=lerp(cam.y,cam.target.y,.08);cam.scale=lerp(cam.scale,cam.target.s,.08)}
function camSet(x,y,s){cam.target={x,y,s}}
function camReset(){cam.target={x:0,y:0,s:1}}

// ── Pattern interrupts (Phase 6) ──
let lastInterrupt=0,interruptFlash=0,interruptZoom=0;
function triggerFlash(){interruptFlash=1}
function triggerZoomPush(){interruptZoom=1}
function drawFlash(){
  if(interruptFlash>0){ctx.save();ctx.globalAlpha=interruptFlash*.15;ctx.fillStyle=CY;ctx.fillRect(0,0,W,H);ctx.restore();interruptFlash=Math.max(0,interruptFlash-.06)}
  if(interruptZoom>0){ctx.save();ctx.globalAlpha=interruptZoom*.1;ctx.fillStyle=GR;ctx.fillRect(0,0,W,H);ctx.restore();interruptZoom=Math.max(0,interruptZoom-.04)}
}

// ── Micro rewards (Phase 10) ──
let lastReward=0,rewardFlash=0;
function checkReward(t){if(t-lastReward>=15){lastReward=t;rewardFlash=1;return true}return false}
function drawRewardFlash(){if(rewardFlash>0){ctx.save();ctx.globalAlpha=rewardFlash*.08;ctx.fillStyle=GR;ctx.fillRect(0,0,W,H);ctx.restore();rewardFlash=Math.max(0,rewardFlash-.03)}}

// ── Ambient system ──
function ambient(t){
  ctx.save();ctx.globalAlpha=.03;ctx.strokeStyle=CY;ctx.lineWidth=1;
  ctx.translate(W/2,H/2);ctx.rotate(t*.12);
  ctx.beginPath();ctx.arc(0,0,340,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,320,Math.PI*.4,Math.PI*1.2);ctx.stroke();
  ctx.restore();
  const sy=Math.sin(t*.35)*180+H/2;
  ctx.save();ctx.globalAlpha=.025;ctx.strokeStyle=CY;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();ctx.restore();
}

  const sa=clamp((t-7)*1.5,0,1);if(sa>0){ctx.globalAlpha=easeO(sa);txt('The biggest untapped growth lever on YouTube',W/2,470,{s:15,c:MU});ctx.globalAlpha=1}

// ═══════════════════════════════════════════════════════════
// PLAYBACK ENGINE — NOW AUDIO-DRIVEN
// ═══════════════════════════════════════════════════════════
const totalDuration=scenes.reduce((s,sc)=>s+sc.duration,0);
let playing=false;

function getSceneAt(time){
  let acc=0;
  for(let i=0;i<scenes.length;i++){
    if(time<acc+scenes[i].duration)return{i,local:time-acc};
    acc+=scenes[i].duration;
  }
  return{i:scenes.length-1,local:scenes[scenes.length-1].duration-.01};
}

function render(){
  // Audio-driven time (Phase 4: sync to narration)
  let t;
  if(audioReady&&audioDuration>0){
    t=audio.currentTime;
  }else{
    // Fallback: use audio.currentTime directly even if metadata not loaded yet
    t=audio.currentTime||0;
  }
  if((t>=totalDuration||audioEnded)&&audioReady){
    if(!audioEnded){audioEnded=true;playing=false;document.getElementById('playBtn').textContent='▶';document.getElementById('replayBtn').style.display='block'}
  }

  const {i,local}=getSceneAt(t);
  scenes[i].draw(local);
  updateCaptionFromAudio(t);

  document.getElementById('progressBar').style.width=(t/totalDuration*100)+'%';
  document.getElementById('timeLabel').textContent=fmt(t)+' / '+fmt(audioReady?audioDuration:totalDuration);
  document.getElementById('sceneLabel').textContent=scenes[i].name;
  requestAnimationFrame(render);
}

function togglePlay(){
  if(audio.currentTime>=totalDuration){audio.currentTime=0;lastReward=0;lastInterrupt=0;document.getElementById('replayBtn').style.display='none'}
  if(audio.paused){audio.play().catch(()=>{});playing=true}
  else{audio.pause();playing=false}
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
}
function restart(){
  audio.currentTime=0;lastReward=0;lastInterrupt=0;currentSentenceIdx=-1;audioEnded=false;
  audio.play().catch(()=>{});playing=true;
  document.getElementById('playBtn').textContent='⏸';
  document.getElementById('replayBtn').style.display='none';
}
function seek(e){
  const r=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-r.left)/r.width;
  const seekTime=pct*totalDuration;
  audio.currentTime=seekTime;
  document.getElementById('replayBtn').style.display='none';
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  if(e.code==='ArrowRight')audio.currentTime=Math.min(audio.currentTime+5,totalDuration);
  if(e.code==='ArrowLeft')audio.currentTime=Math.max(audio.currentTime-5,0);
});

requestAnimationFrame(render);
