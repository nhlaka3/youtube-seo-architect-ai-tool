name: publish-db-manual

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to insert the new blog post row into the production seo_pages DB'
        required: true
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish blog post to seo_pages
        run: node scripts/publish-seo-tips-post-db.js