name: publish-db-manual

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to insert the new blog post row into the production seo_pages DB'
        required: true
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pull production envs from Vercel (provides DATABASE_URL)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest link --yes --project yt-seo-architect --scope thiza3062-1902s-projects --token "$VERCEL_TOKEN"
          npx vercel@latest env pull .env.local --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Publish blog post to seo_pages
        run: node scripts/publish-seo-tips-post-db.js