name: 🌐 Auto-Index Sitemap

on:
  schedule:
    - cron: '0 */6 * * *'     # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:            # Manual trigger from GitHub UI
    inputs:
      deploy:
        description: 'Use --deploy mode (includes Google Indexing API if key is set)'
        type: boolean
        default: false

# ── Required GitHub Secrets ─────────────────────────────────────
# Go to Settings → Secrets and variables → Actions → New secret:
#   GOOGLE_INDEXING_KEY (full JSON contents of the Google service
#                        account key — used for Search Console
#                        sitemap upsert + Indexing API submissions)
#
# IndexNow (Bing/Yandex) works automatically without any secrets.
# ───────────────────────────────────────────────────────────────

permissions:
  contents: write

jobs:
  auto-index:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: 🔧 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔍 Run auto-index (sitemap ping + IndexNow + Google priority pages)
        id: index
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: node scripts/auto-index.mjs --deploy --google-cap 25

      - name: 💾 Commit Google state
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add public/auto-index-google-state.json
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "indexing: auto-index google state [skip ci]"
            git push origin HEAD:main
          fi

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  🌐 AUTO-INDEX REPORT"
          echo "════════════════════════════════════════════"
          echo "  Index step: ${{ steps.index.outcome }}"
          echo "  Time:       $(date -u)"
          echo "  Schedule:   Every 6 hours"
          echo "  Google cap: 25 URLs/run (priority pages)"
          echo "════════════════════════════════════════════"
