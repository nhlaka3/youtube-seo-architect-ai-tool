name: 📢 Daily Cross-Poster

on:
  schedule:
    - cron: '0 10 * * *'     # 10:00 AM UTC daily
  workflow_dispatch:           # Manual trigger
    inputs:
      slug:
        description: 'Specific blog slug to cross-post'
        type: string
        default: ''
      platform:
        description: 'Platform (devto, medium, hashnode, twitter, all)'
        type: string
        default: 'all'

permissions:
  contents: read

jobs:
  crosspost:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔧 Setup Python + Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📝 Step 1 — Cross-post to dev.to (DR 91, dofollow canonical)
        id: devto
        continue-on-error: true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -n "$DEVTO_API_KEY" ]; then
            CMD="python3 scripts/daily-devto-post.py"
            if [ -n "${{ github.event.inputs.slug }}" ]; then
              CMD="$CMD --force ${{ github.event.inputs.slug }}"
            fi
            if [ "${{ github.event.inputs.platform }}" = "devto" ] || [ "${{ github.event.inputs.platform }}" = "all" ] || [ -z "${{ github.event.inputs.platform }}" ]; then
              echo "Posting to dev.to..."
              eval "$CMD"
            else
              echo "Skipped (platform filter)"
            fi
          else
            echo "DEVTO_API_KEY not set — skipping dev.to"
          fi

      - name: 📝 Step 2 — Cross-post to Hashnode (DR 82, dofollow canonical)
        id: hashnode
        continue-on-error: true
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          if [ -n "$HASHNODE_TOKEN" ] && [ -n "$HASHNODE_PUBLICATION_ID" ]; then
            CMD="python3 scripts/backlink-crosspost.py"
            if [ -n "${{ github.event.inputs.slug }}" ]; then
              CMD="$CMD ${{ github.event.inputs.slug }} --platform hashnode"
            else
              CMD="$CMD --list"
            fi
            if [ "${{ github.event.inputs.platform }}" = "hashnode" ] || [ "${{ github.event.inputs.platform }}" = "all" ] || [ -z "${{ github.event.inputs.platform }}" ]; then
              echo "Hashnode posting requires manual execution (see scripts/backlink-crosspost.py)"
            fi
          else
            echo "HASHNODE_TOKEN not set — skipping Hashnode"
          fi

      - name: 📝 Step 3 — Post to Medium (DR 95, dofollow canonical)
        id: medium
        continue-on-error: true
        env:
          MEDIUM_SID: ${{ secrets.MEDIUM_SID }}
          MEDIUM_UID: ${{ secrets.MEDIUM_UID }}
        run: |
          if [ -n "$MEDIUM_SID" ] && [ -n "$MEDIUM_UID" ]; then
            if [ "${{ github.event.inputs.platform }}" = "medium" ] || [ "${{ github.event.inputs.platform }}" = "all" ] || [ -z "${{ github.event.inputs.platform }}" ]; then
              echo "Medium posting requires MEDIUM_SID + MEDIUM_UID setup"
              echo "See scripts/publish-to-medium.mjs for instructions"
            fi
          else
            echo "MEDIUM_SID not set — skipping Medium"
          fi

      - name: 🐦 Step 4 — Post to Twitter/X
        id: twitter
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.platform }}" = "twitter" ] || [ "${{ github.event.inputs.platform }}" = "all" ] || [ -z "${{ github.event.inputs.platform }}" ]; then
            echo "Twitter/X posting requires xurl CLI setup"
            echo "See scripts/auto-social-post.mjs for details"
          fi

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  📢 CROSS-POSTER REPORT"
          echo "════════════════════════════════════════════"
          echo "  dev.to:    ${{ steps.devto.outcome }}"
          echo "  Hashnode:  ${{ steps.hashnode.outcome }}"
          echo "  Medium:    ${{ steps.medium.outcome }}"
          echo "  Twitter:   ${{ steps.twitter.outcome }}"
          echo "  Time:      $(date -u)"
          echo "════════════════════════════════════════════"
