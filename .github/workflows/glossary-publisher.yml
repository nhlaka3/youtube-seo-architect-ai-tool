name: 📖 Glossary Publisher

on:
  schedule:
    - cron: '0 8 * * 1'      # 8:00 AM UTC every Monday
  workflow_dispatch:           # Manual trigger from GitHub UI
    inputs:
      force-expand:
        description: 'Run with --force (skip AI discovery, use combinatorial only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-glossary:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: 🔧 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🔍 Phase 1 — Auto-discover new glossary terms (AI)
        id: discover
        continue-on-error: true
        run: |
          echo "🔍 Auto-discovering new glossary terms..."
          node scripts/auto-glossary-terms.mjs --count 15 2>&1
          echo "DISCOVERED=true" >> $GITHUB_OUTPUT

      - name: 'Phase 2 — Auto-expand: blog scan + combinatorial variants'
        id: expand
        run: |
          echo "🔄 Running glossary auto-expansion engine..."
          node scripts/glossary-auto-expand.mjs --count 10 2>&1
          echo "EXPANDED=true" >> $GITHUB_OUTPUT

      - name: 📖 Phase 3 — Generate all glossary term pages
        id: generate
        run: |
          echo "📖 Generating glossary pages..."
          node scripts/generate-glossary.mjs

      - name: 🗂️ Phase 4 — Generate category landing pages + clusters
        id: categories
        run: |
          echo "🗂️ Generating category pages..."
          node scripts/generate-glossary-categories.mjs

      - name: 🔄 Phase 5 — Generate comparison pages (term-a-vs-term-b)
        id: comparisons
        run: |
          echo "🔄 Generating comparison pages..."
          node scripts/generate-glossary-comparisons.mjs

      - name: 🔗 Phase 6 — Inject glossary cross-links into blog posts
        id: inject-links
        run: |
          echo "🔗 Injecting glossary links into blog posts..."
          node scripts/add-glossary-links.mjs
          node scripts/add-glossary-links-dist.mjs

      - name: 📤 Push to private repo
        id: push
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            echo "COMMITTED=false" >> $GITHUB_OUTPUT
          else
            git commit -m "glossary: batch auto-generated pages"
            git pull --rebase origin main 2>&1 || true
            git push origin HEAD:main 2>&1
            echo "✅ Pushed to private repo"
            echo "COMMITTED=true" >> $GITHUB_OUTPUT
          fi

      - name: 🌐 Push to public repo (triggers Vercel deploy)
        if: steps.push.outputs.COMMITTED == 'true'
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          git remote add public "$PUBLIC_REPO"
          git push public HEAD:main --force 2>&1 && echo "✅ Pushed to public repo — Vercel auto-deploy triggered"

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  📖 GLOSSARY PUBLISHER REPORT"
          echo "════════════════════════════════════════════"
          echo "  AI discover:    ${{ steps.discover.outcome }}"
          echo "  Auto-expand:    ${{ steps.expand.outcome }}"
          echo "  Pages gen:      ${{ steps.generate.outcome }}"
          echo "  Categories:     ${{ steps.categories.outcome }}"
          echo "  Comparisons:    ${{ steps.comparisons.outcome }}"
          echo "  Link inject:    ${{ steps.inject-links.outcome }}"
          echo "  Changes:        ${{ steps.push.outputs.COMMITTED }}"
          echo "  Time:         $(date -u)"
          echo "════════════════════════════════════════════"
