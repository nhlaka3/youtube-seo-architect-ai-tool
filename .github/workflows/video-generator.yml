name: 🎬 Video Generator (OpenMontage)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Output file name (e.g. youtube-tags-2026)'
        type: string
        required: true
      demo:
        description: 'Zero-key demo to render'
        type: choice
        default: 'world-in-numbers'
        options:
          - world-in-numbers
          - code-to-screen
          - focusflow-pitch

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout main project
        uses: actions/checkout@v4
        with:
          path: main-project

      - name: ⬇️ Checkout OpenMontage
        uses: actions/checkout@v4
        with:
          repository: calesthio/OpenMontage
          path: openmontage
          fetch-depth: 1

      - name: 🔧 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔧 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔧 Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 🏗️ Install OpenMontage
        run: |
          cd openmontage
          pip install -r requirements.txt -q
          pip install -e . -q

      - name: 🎬 Render demo video (zero-key, Remotion)
        id: render
        run: |
          DEMO="${{ github.event.inputs.demo }}"
          SLUG="${{ github.event.inputs.slug }}"
          echo "Rendering demo: $DEMO"
          cd openmontage
          python render_demo.py "$DEMO"
          echo "Output dir contents:"
          ls -la projects/demos/renders/
          # Copy to main project media dir with the requested slug name
          mkdir -p ../main-project/media/videos
          cp "projects/demos/renders/$DEMO.mp4" "../main-project/media/videos/$SLUG.mp4"
          SIZE=$(du -h "../main-project/media/videos/$SLUG.mp4" | cut -f1)
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "✅ Video ready: media/videos/$SLUG.mp4 ($SIZE)"

      - name: 📦 Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.slug }}
          path: main-project/media/videos/${{ github.event.inputs.slug }}.mp4

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  🎬 VIDEO GENERATION REPORT"
          echo "════════════════════════════════════════════"
          echo "  Demo:    ${{ github.event.inputs.demo }}"
          echo "  Output:  media/videos/${{ github.event.inputs.slug }}.mp4"
          echo "  Size:    ${{ steps.render.outputs.SIZE }}"
          echo "  Status:  ${{ steps.render.outcome }}"
          echo "  Time:    $(date -u)"
          echo "════════════════════════════════════════════"
          echo ""
          echo "Artifact 'video-${{ github.event.inputs.slug }}' is downloadable from this run."
          echo ""
          echo "NOTE: This uses OpenMontage's zero-key Remotion demo path (no AI/API keys)."
          echo "To generate real AI explainer videos, the workflow needs an agent driver"
          echo "(Codex/Claude Code CLI) — see AGENTS.md video production stack."
