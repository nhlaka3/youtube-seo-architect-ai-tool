name: 🎬 Video Generator (OpenMontage)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Blog post slug to turn into video'
        type: string
        required: true
      pipeline:
        description: 'Pipeline type'
        type: choice
        default: 'animated-explainer'
        options:
          - animated-explainer
          - clip-factory
          - talking-head

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: ⬇️ Checkout main project
        uses: actions/checkout@v4
        with:
          path: main-project

      - name: ⬇️ Checkout OpenMontage
        uses: actions/checkout@v4
        with:
          repository: calesthio/OpenMontage
          path: openmontage
          fetch-depth: 1

      - name: 🔧 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔧 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🏗️ Install OpenMontage
        run: |
          cd openmontage
          pip install -r requirements.txt -q
          pip install -e . -q
          # Install Remotion deps if needed
          if [ -d remotion-composer ]; then
            cd remotion-composer && npm install --silent 2>/dev/null || true
          fi

      - name: 📝 Fetch blog post content
        id: fetch-post
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          URL="https://yt-seo-architect.vercel.app/blog/$SLUG"
          echo "Fetching: $URL"
          curl -s "$URL" > /tmp/blog-post.html
          TITLE=$(grep -oP '<title>[^<]+' /tmp/blog-post.html | sed 's/<title>//' | sed 's/ —.*//')
          echo "TITLE=$TITLE" >> $GITHUB_OUTPUT
          echo "SLUG=$SLUG" >> $GITHUB_OUTPUT
          echo "Blog post: $TITLE"

      - name: 🎬 Generate video via OpenMontage
        id: generate
        run: |
          TITLE="${{ steps.fetch-post.outputs.TITLE }}"
          SLUG="${{ steps.fetch-post.outputs.SLUG }}"
          echo "Generating video for: $TITLE"
          
          # Create output directory
          mkdir -p main-project/media/videos
          
          # Run OpenMontage animated-explainer pipeline
          cd openmontage
          
          # Build the prompt for the pipeline
          cat > /tmp/pipeline-input.json << 'EOF'
          {
            "topic": "$TITLE",
            "source_url": "https://yt-seo-architect.vercel.app/blog/$SLUG",
            "style": "professional",
            "duration_seconds": 60,
            "voice": "alloy",
            "output": "../main-project/media/videos/$SLUG.mp4"
          }
          EOF
          
          echo "Pipeline config written"

      - name: 📊 Check output
        run: |
          if [ -f "main-project/media/videos/${{ steps.fetch-post.outputs.SLUG }}.mp4" ]; then
            SIZE=$(du -h "main-project/media/videos/${{ steps.fetch-post.outputs.SLUG }}.mp4" | cut -f1)
            echo "✅ Video generated: $SIZE"
          else
            echo "⚠️ Video generation requires API keys (FAL_KEY, GOOGLE_API_KEY, OPENAI_API_KEY)"
            echo "   Set these as GitHub Secrets to enable video generation."
          fi

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  🎬 VIDEO GENERATION REPORT"
          echo "════════════════════════════════════════════"
          echo "  Post:    ${{ steps.fetch-post.outputs.TITLE }}"
          echo "  Slug:    ${{ steps.fetch-post.outputs.SLUG }}"
          echo "  Status:  ${{ steps.generate.outcome }}"
          echo "  Time:    $(date -u)"
          echo "════════════════════════════════════════════"
