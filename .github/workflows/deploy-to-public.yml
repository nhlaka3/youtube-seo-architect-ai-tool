name: 🌐 Deploy to Public Repo

on:
  push:
    branches: [main]
    paths:
      - 'public/blog/**'
      - 'public/vs/**'
      - 'public/widgets/**'
      - 'api/pseo/**'
      - 'api/programmatic-seo/**'
      - 'scripts/vs-data.js'
      - 'scripts/generate-vs-pages.mjs'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📊 Regenerate vs/ comparison pages
        run: |
          echo "Regenerating comparison pages from data..."
          node scripts/generate-vs-pages.mjs 2>&1
          echo "✅ vs/ pages regenerated"

      - name: 📦 Commit regenerated pages
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add public/vs/
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "vs: regenerate comparison pages from data"
            git pull --rebase origin main 2>&1 || true
            git push origin HEAD:main 2>&1
            echo "✅ Committed and pushed to private repo"
          fi

      - name: 🌐 Push to public repo (triggers Vercel deploy)
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          echo "Pushing to public repo..."
          git remote add public "$PUBLIC_REPO"
          git push public HEAD:main --force 2>&1
          echo "✅ Pushed to public repo — Vercel auto-deploy triggered"
