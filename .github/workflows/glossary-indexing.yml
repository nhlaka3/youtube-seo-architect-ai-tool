name: 📡 Glossary Indexing (200/day)

on:
  schedule:
    - cron: '30 5 * * *'     # Daily at 05:30 UTC (07:30 SAST) — after blog publisher
  workflow_dispatch:           # Manual trigger

permissions:
  contents: write

jobs:
  index-glossary:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: 🔧 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📡 Submit 200 glossary URLs to Google Indexing API
        id: submit
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: node scripts/submit-glossary-batch.mjs

      - name: 💾 Commit cursor progress
        id: commit
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add public/glossary-indexing-cursor.json
          if git diff --staged --quiet; then
            echo "No cursor changes"
          else
            git commit -m "indexing: glossary cursor update [skip ci]"
            git push origin HEAD:main
          fi

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  📡 GLOSSARY INDEXING REPORT"
          echo "════════════════════════════════════════════"
          echo "  Submit step: ${{ steps.submit.outcome }}"
          echo "  Cursor:      $(cat public/glossary-indexing-cursor.json 2>/dev/null | grep -o '"index":[0-9]*' | cut -d: -f2)/$(cat public/glossary-indexing-cursor.json 2>/dev/null | grep -o '"total":[0-9]*' | cut -d: -f2)"
          echo "  Completed:   $(cat public/glossary-indexing-cursor.json 2>/dev/null | grep -o '"completed":[a-z]*' | cut -d: -f2)"
          echo "  Time:        $(date -u)"
          echo "  Schedule:    Daily at 05:30 UTC"
          echo "════════════════════════════════════════════"
