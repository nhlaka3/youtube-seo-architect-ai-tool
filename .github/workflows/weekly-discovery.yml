name: 🔄 Weekly Content Discovery

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of new items per category'
        type: number
        default: 2

permissions:
  contents: write

jobs:
  discover-and-deploy:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: 🔍 Discover new niches
        continue-on-error: true
        run: node scripts/auto-discover-niches.mjs --count ${{ github.event.inputs.count || '2' }}

      - name: 🔍 Discover new tools
        continue-on-error: true
        run: node scripts/auto-discover-tools.mjs --count ${{ github.event.inputs.count || '2' }}

      - name: 📤 Commit via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys

          repo = "nhlaka3/yt-seo-architect-private"
          files_to_check = ["scripts/niches-data.js", "scripts/vs-data.js",
                            "public/niches/index.html", "public/vs/index.html"]

          def gh(args, input_data=None):
              cmd = ["gh", "api", "--jq", "."] + args
              p = subprocess.run(cmd, input=input_data, capture_output=True, text=True)
              if p.returncode != 0:
                  print(f"gh error: {p.stderr[:200]}")
                  return None
              return json.loads(p.stdout)

          head = gh(["repos/" + repo + "/git/refs/heads/main"])["object"]["sha"]
          base_tree = gh(["repos/" + repo + "/git/commits/" + head])["tree"]["sha"]
          print(f"HEAD: {head}  Tree: {base_tree}")

          tree_entries = []
          for f in files_to_check:
            if os.path.exists(f):
              with open(f, "r", encoding="utf-8") as fh:
                content = fh.read()
              blob_resp = gh(["repos/" + repo + "/git/blobs", "--input", "-"],
                            input_data=json.dumps({"content": content, "encoding": "utf-8"}))
              if blob_resp:
                tree_entries.append({"path": f, "mode": "100644", "type": "blob", "sha": blob_resp["sha"]})
                print(f"  Added: {f} ({len(content)} bytes)")

          if not tree_entries:
            print("No files to commit")
            sys.exit(0)

          tree_resp = gh(["repos/" + repo + "/git/trees", "--input", "-"],
                        input_data=json.dumps({"base_tree": base_tree, "tree": tree_entries}))
          if not tree_resp:
            sys.exit(1)
          if tree_resp.get("sha") == base_tree:
            print("No changes - tree unchanged")
            sys.exit(0)
          new_tree = tree_resp["sha"]
          print(f"New tree: {new_tree}")

          commit_resp = gh(["repos/" + repo + "/git/commits", "--input", "-"],
                          input_data=json.dumps({"message": "discovery: weekly auto-discovered content [skip ci]", "tree": new_tree, "parents": [head]}))
          if not commit_resp:
            sys.exit(1)
          new_commit = commit_resp["sha"]
          print(f"New commit: {new_commit}")

          ref_resp = gh(["repos/" + repo + "/git/refs/heads/main", "-X", "PATCH", "--input", "-"],
                       input_data=json.dumps({"sha": new_commit, "force": True}))
          if ref_resp:
            print(f"✅ Committed via API: {ref_resp['ref']}")
          PYEOF

      - name: 🌐 Deploy to Vercel
        continue-on-error: true  # mirror push blocked by push protection; deploys go via private repo -> Vercel
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          git fetch origin main 2>/dev/null
          git reset --hard origin/main 2>/dev/null
          git remote add public "$PUBLIC_REPO" 2>/dev/null || true
          git push public HEAD:main --force 2>&1 && echo "✅ Deployed to Vercel"