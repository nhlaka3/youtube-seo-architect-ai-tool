name: 🔄 Weekly Content Discovery

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of new items per category'
        type: number
        default: 2

permissions:
  contents: write

jobs:
  discover-and-deploy:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: 🔍 Discover and commit
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          COUNT=${{ github.event.inputs.count || '2' }}

          echo "=== Discovering niches ==="
          node scripts/auto-discover-niches.mjs --count $COUNT 2>&1 || true

          echo "=== Discovering tools ==="
          node scripts/auto-discover-tools.mjs --count $COUNT 2>&1 || true

          echo "=== Checking git status ==="
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"

          # Debug: check if files are actually different
          echo "--- git status ---"
          git status --porcelain || true
          echo "--- git diff ---"
          git diff --name-only || true
          echo "--- wc -l files ---"
          wc -l scripts/niches-data.js scripts/vs-data.js 2>/dev/null || true

          # Try to add and commit
          git add -A 2>&1 || true
          git status --porcelain 2>&1 || true

          CHANGES=$(git status --porcelain 2>/dev/null | wc -l)
          if [ "$CHANGES" -gt 0 ]; then
            echo "Changes found: $CHANGES"
            git commit -m "discovery: weekly auto-discovered content [skip ci]"
            git push origin HEAD:main 2>&1
          else
            echo "No git changes detected"
          fi

          # Always push to public (latest main, not modified)
          git remote add public "$PUBLIC_REPO" 2>/dev/null || true
          git push public HEAD:main --force 2>&1 && echo "✅ Pushed to public repo"