name: 🔄 Weekly Content Discovery

on:
  schedule:
    - cron: '0 10 * * 3'     # 10:00 AM UTC every Wednesday
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of new items per category'
        type: number
        default: 2

permissions:
  contents: write

jobs:
  discover-and-deploy:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: 🔍 Discover new niches
        continue-on-error: true
        run: node scripts/auto-discover-niches.mjs --count ${{ github.event.inputs.count || '2' }} 2>&1

      - name: 🔍 Discover new comparison tools
        continue-on-error: true
        run: node scripts/auto-discover-tools.mjs --count ${{ github.event.inputs.count || '2' }} 2>&1

      - name: 📤 Commit and push discoveries
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          # Force-add all changed files in tracked paths
          git add -A scripts/niches-data.js scripts/vs-data.js public/niches/ public/vs/ public/guides/ public/tools/converters/ 2>&1 || true
          # Check if anything changed
          CHANGES=$(git status --porcelain scripts/niches-data.js scripts/vs-data.js public/niches/ public/vs/ public/guides/ public/tools/converters/ 2>/dev/null | wc -l)
          if [ "$CHANGES" -gt 0 ]; then
            echo "Changes detected: $CHANGES file(s)"
            git status --porcelain scripts/niches-data.js scripts/vs-data.js public/niches/ public/vs/ public/guides/ public/tools/converters/
            git commit -m "discovery: weekly auto-discovered content [skip ci]"
            git push origin HEAD:main 2>&1
            echo "✅ Committed and pushed to private repo"
          else
            echo "✅ No changes to commit"
          fi

      - name: 🌐 Deploy to Vercel
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          git remote add public "$PUBLIC_REPO"
          git push public HEAD:main --force 2>&1 && echo "✅ Pushed to public repo — Vercel auto-deploy triggered"