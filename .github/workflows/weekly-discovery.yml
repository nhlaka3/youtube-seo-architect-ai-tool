name: 🔄 Weekly Content Discovery

on:
  schedule:
    - cron: '0 10 * * 3'     # 10:00 AM UTC every Wednesday
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of new items to discover per category'
        type: number
        default: 2
      niches:
        description: 'Discover new niches?'
        type: boolean
        default: true
      tools:
        description: 'Discover new comparison tools?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  discover-niches:
    if: ${{ github.event.inputs.niches != 'false' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 🔍 Discover new niches
        continue-on-error: true
        run: node scripts/auto-discover-niches.mjs --count ${{ github.event.inputs.count || '2' }} 2>&1
      - name: 📤 Commit niche discoveries
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add scripts/niches-data.js public/niches/
          git status --short
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "discovery: new niches [skip ci]" && git pull --rebase origin main 2>&1 || true && git push origin HEAD:main 2>&1 || true)
          echo "✅ Niche step done"

  discover-tools:
    if: ${{ github.event.inputs.tools != 'false' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 🔍 Discover new tools
        continue-on-error: true
        run: node scripts/auto-discover-tools.mjs --count ${{ github.event.inputs.count || '2' }} 2>&1
      - name: 📤 Commit tool discoveries
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add scripts/vs-data.js public/vs/
          git status --short
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "discovery: new tools [skip ci]" && git pull --rebase origin main 2>&1 || true && git push origin HEAD:main 2>&1 || true)
          echo "✅ Tool step done"

  deploy:
    needs: [discover-niches, discover-tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - name: 🌐 Push to public repo
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          git remote add public "$PUBLIC_REPO"
          git push public HEAD:main --force 2>&1 && echo "✅ Pushed to public repo — Vercel auto-deploy triggered"