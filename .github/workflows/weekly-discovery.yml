name: 🔄 Weekly Content Discovery

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of new items per category'
        type: number
        default: 2

permissions:
  contents: write

jobs:
  discover-and-deploy:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: 🔍 Discover new niches
        continue-on-error: true
        run: node scripts/auto-discover-niches.mjs --count ${{ github.event.inputs.count || '2' }}

      - name: 🔍 Discover new tools
        continue-on-error: true
        run: node scripts/auto-discover-tools.mjs --count ${{ github.event.inputs.count || '2' }}

      - name: 📤 Commit via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Create a tree with updated files via gh api
          HEAD_SHA=$(gh api repos/nhlaka3/yt-seo-architect-private/git/refs/heads/main --jq '.object.sha')
          BASE_TREE=$(gh api repos/nhlaka3/yt-seo-architect-private/git/commits/$HEAD_SHA --jq '.tree.sha')
          
          echo "HEAD: $HEAD_SHA  Tree: $BASE_TREE"
          
          # Add files that exist and have changed
          FILES=""
          for f in scripts/niches-data.js scripts/vs-data.js public/niches/index.html; do
            if [ -f "$f" ]; then
              BLOB=$(gh api repos/nhlaka3/yt-seo-architect-private/git/blobs -f content=@$f -f encoding=utf-8 --jq '.sha')
              FILES="$FILES{\"path\":\"$f\",\"mode\":\"100644\",\"type\":\"blob\",\"sha\":\"$BLOB\"},"
              echo "  Added: $f"
            fi
          done
          
          if [ -z "$FILES" ]; then
            echo "No files to commit"
            exit 0
          fi
          
          NEW_TREE=$(echo "{\"base_tree\":\"$BASE_TREE\",\"tree\":[$FILES]}" | \
            gh api repos/nhlaka3/yt-seo-architect-private/git/trees --input - --jq '.sha')
          
          echo "New tree: $NEW_TREE"
          
          if [ "$NEW_TREE" = "$BASE_TREE" ]; then
            echo "No changes - tree unchanged"
            exit 0
          fi
          
          NEW_COMMIT=$(echo "{\"message\":\"discovery: weekly auto-discovered content [skip ci]\",\"tree\":\"$NEW_TREE\",\"parents\":[\"$HEAD_SHA\"]}" | \
            gh api repos/nhlaka3/yt-seo-architect-private/git/commits --input - --jq '.sha')
          
          echo "New commit: $NEW_COMMIT"
          
          gh api repos/nhlaka3/yt-seo-architect-private/git/refs/heads/main \
            -X PATCH -f sha=$NEW_COMMIT -f force=true --jq '.ref'
          
          echo "✅ Committed via API"

      - name: 🌐 Deploy to Vercel
        env:
          PUBLIC_REPO: https://x-access-token:${{ secrets.GH_PAT }}@github.com/nhlaka3/youtube-seo-architect-ai-tool.git
        run: |
          git fetch origin main 2>/dev/null
          git reset --hard origin/main 2>/dev/null
          git remote add public "$PUBLIC_REPO" 2>/dev/null || true
          git push public HEAD:main --force 2>&1 && echo "✅ Deployed to Vercel"