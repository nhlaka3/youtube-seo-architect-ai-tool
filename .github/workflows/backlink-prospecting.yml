name: 🔗 Daily Backlink Outreach

on:
  schedule:
    - cron: '0 9 * * *'      # 9:00 AM UTC daily
  workflow_dispatch:           # Manual trigger

# ── Required GitHub Secrets ─────────────────────────────────────
# Go to Settings → Secrets and variables → Actions → New secret:
#   GH_PAT          (required — Personal Access Token with repo scope)
#   SMTP_HOST       (required — smtp.gmail.com)
#   SMTP_PORT       (optional — default: 587)
#   SMTP_USER       (required — your@gmail.com)
#   SMTP_PASS       (required — 16-char Gmail App Password)
#   SMTP_FROM       (required — "Your Name <your@gmail.com>")
#   SMTP_FROM_NAME  (required — "Your Name" for body personalization)
# ─────────────────────────────────────────────────────────────────

permissions:
  contents: write

jobs:
  backlink-outreach:
    runs-on: ubuntu-latest

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install dnspython requests

      # ── Prepare output directory ──
      - name: 📁 Create output directory
        run: mkdir -p /tmp/backlink-scans

      # ── Scan 1: Broken link opportunities ──
      - name: 🔍 Scan 1/6 — Broken link opportunities
        id: scan-broken
        continue-on-error: true
        run: |
          python3 scripts/backlink-finder.py \
            "youtube seo tools" \
            --pages 10 \
            --output /tmp/backlink-scans/opportunities-broken.csv 2>&1 | tee /tmp/backlink-scans/scan1-output.txt

      # ── Scan 2: Competitor backlink gaps ──
      - name: 🔍 Scan 2/6 — Competitor backlink gaps
        id: scan-competitor
        continue-on-error: true
        run: |
          python3 scripts/competitor-backlink-replicator.py \
            --pages 15 \
            --output /tmp/backlink-scans/opportunities-competitor.csv 2>&1 | tee /tmp/backlink-scans/scan2-output.txt

      # ── Scan 3: Resource page opportunities ──
      - name: 🔍 Scan 3/6 — Resource page opportunities
        id: scan-resource
        continue-on-error: true
        run: |
          python3 scripts/resource-page-outreach.py \
            --pages 15 \
            --output /tmp/backlink-scans/opportunities-resource.csv 2>&1 | tee /tmp/backlink-scans/scan3-output.txt

      # ── Scan 4: Skyscraper Technique (competitor alternative pitch) ──
      - name: 🔍 Scan 4/6 — Skyscraper competitor alternative pitch
        id: scan-skyscraper
        continue-on-error: true
        run: |
          python3 scripts/skyscraper-technique.py \
            --pages 15 \
            --output /tmp/backlink-scans/opportunities-skyscraper.csv 2>&1 | tee /tmp/backlink-scans/scan4-output.txt

      # ── Scan 5: Guest Blogging opportunities ──
      - name: 🔍 Scan 5/6 — Guest Blogging opportunities
        id: scan-guest
        continue-on-error: true
        run: |
          python3 scripts/guest-blogging-scanner.py \
            --pages 15 \
            --output /tmp/backlink-scans/opportunities-guest.csv 2>&1 | tee /tmp/backlink-scans/scan5-output.txt

      # ── Scan 6: Link Swap opportunities ──
      - name: 🔍 Scan 6/6 — Link Swap opportunities
        id: scan-swap
        continue-on-error: true
        run: |
          python3 scripts/link-swap-scanner.py \
            --pages 15 \
            --output /tmp/backlink-scans/opportunities-swap.csv 2>&1 | tee /tmp/backlink-scans/scan6-output.txt

      # ── Count opportunities per scan (display only, no combine) ──
      - name: 📋 Count opportunities
        id: count
        run: |
          TOTAL=0
          for f in /tmp/backlink-scans/opportunities-*.csv; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              LINES=$(wc -l < "$f")
              if [ "$LINES" -gt 1 ]; then
                COUNT=$((LINES - 1))
                TOTAL=$((TOTAL + COUNT))
                echo "  $COUNT from $(basename $f)"
              fi
            fi
          done
          echo "TOTAL=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total: $TOTAL opportunities across all scans"

      # ── Send outreach: broken link opportunities ──
      # Note: hashFiles() not used — it can't see /tmp/. wc -l handles missing files.
      - name: 📧 Send outreach — broken links
        continue-on-error: true
        run: |
          FILE=/tmp/backlink-scans/opportunities-broken.csv
          if [ -f "$FILE" ] && [ -s "$FILE" ]; then
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -gt 1 ]; then
              python3 scripts/backlink-outreach-sender.py --file "$FILE" --limit 5
            fi
          else
            echo "No broken link opportunities to send"
          fi

      # ── Send outreach: competitor gap opportunities ──
      - name: 📧 Send outreach — competitor gaps
        continue-on-error: true
        run: |
          FILE=/tmp/backlink-scans/opportunities-competitor.csv
          if [ -f "$FILE" ] && [ -s "$FILE" ]; then
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -gt 1 ]; then
              python3 scripts/backlink-outreach-sender.py --file "$FILE" --limit 5
            fi
          else
            echo "No competitor gap opportunities to send"
          fi

      # ── Send outreach: resource page opportunities ──
      - name: 📧 Send outreach — resource pages
        continue-on-error: true
        run: |
          FILE=/tmp/backlink-scans/opportunities-resource.csv
          if [ -f "$FILE" ] && [ -s "$FILE" ]; then
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -gt 1 ]; then
              python3 scripts/backlink-outreach-sender.py --file "$FILE" --limit 5
            fi
          else
            echo "No resource page opportunities to send"
          fi

      # ── Send outreach: skyscraper competitor pitch opportunities ──
      - name: 📧 Send outreach — skyscraper competitor pitches
        continue-on-error: true
        run: |
          FILE=/tmp/backlink-scans/opportunities-skyscraper.csv
          if [ -f "$FILE" ] && [ -s "$FILE" ]; then
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -gt 1 ]; then
              python3 scripts/backlink-outreach-sender.py --file "$FILE" --limit 5
            fi
          else
            echo "No skyscraper opportunities to send"
          fi

      # ── Send outreach: guest blog pitching opportunities ──
      - name: 📧 Send outreach — guest blog pitches
        continue-on-error: true
        run: |
          FILE=/tmp/backlink-scans/opportunities-guest.csv
          if [ -f "$FILE" ] && [ -s "$FILE" ]; then
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -gt 1 ]; then
              python3 scripts/backlink-outreach-sender.py --file "$FILE" --limit 5
            fi
          else
            echo "No guest blog opportunities to send"
          fi

      # ── Send outreach: link swap opportunities ──
      - name: 📧 Send outreach — link swap proposals
        continue-on-error: true
        run: |
          FILE=/tmp/backlink-scans/opportunities-swap.csv
          if [ -f "$FILE" ] && [ -s "$FILE" ]; then
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -gt 1 ]; then
              python3 scripts/backlink-outreach-sender.py --file "$FILE" --limit 5
            fi
          else
            echo "No link swap opportunities to send"
          fi

      # ── HARO/Connectively journalist query responder ──
      - name: 📰 HARO journalist query responder
        continue-on-error: true
        run: |
          if [ -f scripts/haro-automator.py ]; then
            python3 scripts/haro-automator.py --dry-run 2>&1 | tee /tmp/backlink-scans/haro-output.txt || true
          else
            echo "HARO script not found, skipping"
          fi

      # ── Backlink cross-post (dev.to, Hashnode) ──
      - name: 📝 Backlink cross-post to dev.to / Hashnode
        continue-on-error: true
        run: |
          if [ -f scripts/backlink-crosspost.py ]; then
            python3 scripts/backlink-crosspost.py --list --dry-run 2>&1 | tee /tmp/backlink-scans/crosspost-output.txt || true
          else
            echo "Crosspost script not found, skipping"
          fi

      # ── Scan 7: Backlink health audit (if any CSVs were found) ──
      - name: 🔬 Scan 7/7 — Backlink health audit
        id: scan-audit
        continue-on-error: true
        run: |
          # Combine all opportunity CSVs into a single backlink list for audit
          AUDIT_CSV=/tmp/backlink-scans/audit-input.csv
          OUTFILE=/tmp/backlink-scans/audit-report.json
          FIRST=1
          for f in /tmp/backlink-scans/opportunities-*.csv; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              if [ "$FIRST" -eq 1 ]; then
                cp "$f" "$AUDIT_CSV"
                FIRST=0
              else
                tail -n +2 "$f" >> "$AUDIT_CSV"
              fi
            fi
          done
          if [ -f "$AUDIT_CSV" ] && [ -s "$AUDIT_CSV" ]; then
            python3 scripts/backlink-auditor.py --file "$AUDIT_CSV" 2>&1 | tee /tmp/backlink-scans/audit-output.txt
            # Copy audit report to reports dir
            cp marketing/backlink-reports/audit-*.json /tmp/backlink-scans/ 2>/dev/null || true
            echo "✅ Backlink audit complete"
          else
            echo "No data for backlink audit"
          fi

      # ── Save reports to repo ──
      - name: 💾 Save reports to repo
        run: |
          DATE=$(date +%Y-%m-%d)
          REPORT_DIR="marketing/backlink-reports/$DATE"
          mkdir -p "$REPORT_DIR"

          # Copy all scan outputs (silently skip missing files)
          cp /tmp/backlink-scans/opportunities-broken.csv "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/opportunities-competitor.csv "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/opportunities-resource.csv "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/opportunities-skyscraper.csv "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/opportunities-guest.csv "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/opportunities-swap.csv "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/scan1-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/scan2-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/scan3-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/scan4-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/scan5-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/scan6-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/haro-output.txt "$REPORT_DIR/" 2>/dev/null || true
          cp /tmp/backlink-scans/crosspost-output.txt "$REPORT_DIR/" 2>/dev/null || true

      # ── Commit and push results (including sent DB for dedup) ──
      - name: 📋 Commit reports and sent DB
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "hnhlaka142@gmail.com"
          git add marketing/backlink-reports/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "backlinks: daily outreach scan $(date +%Y-%m-%d) [skip ci]"
            git push origin HEAD:main 2>&1 || true
            echo "✅ Pushed updates to repo"
          else
            echo "No changes to commit"
          fi

      # ── Summary report ──
      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  🔗 DAILY BACKLINK OUTREACH REPORT"
          echo "════════════════════════════════════════════"
          echo "  Broken links:    ${{ steps.scan-broken.outcome }}"
          echo "  Competitor:      ${{ steps.scan-competitor.outcome }}"
          echo "  Resource pages:  ${{ steps.scan-resource.outcome }}"
          echo "  Skyscraper:      ${{ steps.scan-skyscraper.outcome }}"
          echo "  Guest blogging:  ${{ steps.scan-guest.outcome }}"
          echo "  Link swap:       ${{ steps.scan-swap.outcome }}"
          echo "  Total opps:      ${{ steps.count.outputs.TOTAL }}"
          echo "  Time:            $(date -u)"
          echo "════════════════════════════════════════════"
