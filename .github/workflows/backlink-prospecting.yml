name: 🔗 Weekly Backlink Prospecting

on:
  schedule:
    - cron: '0 9 * * 1'      # 9:00 AM UTC every Monday (after glossary publisher)
  workflow_dispatch:           # Manual trigger
    inputs:
      keyword:
        description: 'Search keyword for backlink opportunities'
        type: string
        default: 'youtube seo tools'
      pages:
        description: 'Number of search result pages to scan'
        type: number
        default: 5

permissions:
  contents: write

jobs:
  find-backlinks:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: 🔧 Setup Python + Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔍 Step 1 — Scan for broken link opportunities
        id: scan
        run: |
          echo "Searching for '${{ github.event.inputs.keyword || 'youtube seo tools' }}'..."
          python3 scripts/backlink-finder.py \
            "${{ github.event.inputs.keyword || 'youtube seo tools' }}" \
            --pages "${{ github.event.inputs.pages || 5 }}" \
            --output /tmp/backlink-opportunities.csv 2>&1 | tee /tmp/scan-output.txt
          echo "SCAN_DONE=true" >> $GITHUB_OUTPUT

      - name: 💾 Step 2 — Save opportunities to repo for manual review
        id: save
        run: |
          mkdir -p marketing/backlink-reports
          REPORT="marketing/backlink-reports/opportunities-$(date +%Y-%m-%d).csv"
          if [ -f /tmp/backlink-opportunities.csv ] && [ -s /tmp/backlink-opportunities.csv ]; then
            cp /tmp/backlink-opportunities.csv "$REPORT"
            echo "Saved $(wc -l < "$REPORT") opportunities to $REPORT"
            echo "OPPORTUNITIES=$(wc -l < "$REPORT")" >> $GITHUB_OUTPUT
          else
            echo "No opportunities found this week"
            echo "OPPORTUNITIES=0" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Step 3 — Commit report
        run: |
          git config user.name "YT SEO Bot"
          git config user.email "thiza3062@gmail.com"
          git add marketing/backlink-reports/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "backlinks: weekly opportunity scan $(date +%Y-%m-%d) [skip ci]"
            git push origin HEAD:main 2>&1 || true
          else
            echo "No changes to commit"
          fi

      - name: 📊 Report
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  🔗 BACKLINK PROSPECTING REPORT"
          echo "════════════════════════════════════════════"
          echo "  Scan step:   ${{ steps.scan.outcome }}"
          echo "  Outreach:    ${{ steps.outreach.outcome }}"
          echo "  Keyword:     ${{ github.event.inputs.keyword || 'youtube seo tools' }}"
          echo "  Time:        $(date -u)"
          echo "════════════════════════════════════════════"
