<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1E3A"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  
  <!-- Professional blouse -->
  <path d="M130,350 L100,480 L300,480 L270,350 Z" fill="#2D7DD2"/>
  <path d="M155,350 L170,290 L200,310 L230,290 L245,350 Z" fill="#4A90D9"/>
  
  <!-- Neck -->
  <rect x="180" y="280" width="40" height="70" rx="5" fill="#A0724A"/>
  
  <!-- Face -->
  <ellipse cx="200" cy="220" rx="65" ry="78" fill="#8B5E3C"/>
  
  <!-- Hair - styled bob -->
  <ellipse cx="200" cy="155" rx="75" ry="55" fill="#1A0F0A"/>
  <path d="M125,165 Q120,130 140,120 Q160,140 150,200 Z" fill="#1A0F0A"/>
  <path d="M275,165 Q280,130 260,120 Q240,140 250,200 Z" fill="#1A0F0A"/>
  <!-- Hair top volume -->
  <ellipse cx="200" cy="140" rx="65" ry="45" fill="#1A0F0A"/>
  <!-- Hair shine -->
  <path d="M160,130 Q200,110 240,130" stroke="#3D2317" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Eyebrows -->
  <path d="M155,205 Q170,198 185,207" stroke="#1A0F0A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M245,207 Q230,198 215,205" stroke="#1A0F0A" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <ellipse cx="172" cy="218" rx="14" ry="10" fill="white"/>
  <ellipse cx="228" cy="218" rx="14" ry="10" fill="white"/>
  <circle cx="175" cy="219" r="6" fill="#3B1F0B"/>
  <circle cx="231" cy="219" r="6" fill="#3B1F0B"/>
  <circle cx="177" cy="218" r="2.5" fill="#1A0A00"/>
  <circle cx="233" cy="218" r="2.5" fill="#1A0A00"/>
  
  <!-- Nose -->
  <path d="M200,225 L195,248 L203,251" stroke="#6B3F1F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Confident smile -->
  <ellipse cx="200" cy="274" rx="22" ry="14" fill="#6B2020"/><path d="M178,274 Q200,292 222,274" stroke="#C4725A" stroke-width="4" fill="none"/>
  
  <!-- Professional glasses -->
  <rect x="152" y="208" width="38" height="24" rx="4" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <rect x="210" y="208" width="38" height="24" rx="4" fill="none" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="190" y1="220" x2="210" y2="220" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Gold earrings -->
  <circle cx="131" cy="230" r="6" fill="#D4A843" stroke="#B89630" stroke-width="1"/>
  <circle cx="269" cy="230" r="6" fill="#D4A843" stroke="#B89630" stroke-width="1"/>
  
  <!-- Subtle cheek warmth -->
  <ellipse cx="158" cy="245" rx="12" ry="8" fill="#C08060" opacity="0.3"/>
  <ellipse cx="242" cy="245" rx="12" ry="8" fill="#C08060" opacity="0.3"/>
  
  <!-- Presenter label -->
  <text x="200" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#888899">Your AI Growth Coach</text>
</svg>
