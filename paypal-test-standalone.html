<!DOCTYPE html>
<html>
<head>
    <title>PayPal Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1f2937; color: white; }
        #paypal-button-container {
            min-height: 150px;
            display: flex !important;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 10004;
            margin: 1rem 0;
            border: 3px solid #ff6b35;
            background: rgba(255, 107, 53, 0.1);
            padding: 20px;
        }
        #paypal-button-container iframe {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative !important;
            z-index: 10005 !important;
            width: 100% !important;
            min-height: 50px !important;
            height: auto !important;
            border: 2px solid #22c55e !important;
            background: white !important;
        }
    </style>
</head>
<body>
    <h1>PayPal Button Test</h1>
    <p>Testing PayPal button visibility outside modal...</p>

    <div id="paypal-button-container"></div>

    <script>
        console.log('Loading PayPal SDK...');

        // Load PayPal SDK
        const script = document.createElement('script');
        script.src = 'https://www.paypal.com/sdk/js?client-id=AUI5l3YbwHsiKNq-XFVHLJSuagJsTGVTCJkalxsbY8VuUEoavAHcFVKsC7ZD4AQMaH_mTt1ccpna8f8i&components=buttons';
        script.onload = () => {
            console.log('PayPal SDK loaded successfully');

            // Render PayPal buttons
            paypal.Buttons({
                style: {
                    layout: 'vertical',
                    color: 'gold',
                    shape: 'rect',
                    label: 'paypal'
                },
                createOrder: function(data, actions) {
                    return actions.order.create({
                        purchase_units: [{
                            amount: { value: '10.00' },
                            description: 'Test Purchase'
                        }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        alert('Transaction completed by ' + details.payer.name.given_name);
                    });
                },
                onCancel: function() {
                    alert('Payment cancelled');
                },
                onError: function(err) {
                    console.error('PayPal error:', err);
                    alert('PayPal error: ' + err.message);
                }
            }).render('#paypal-button-container');

            console.log('PayPal buttons rendered');

            // Check after 2 seconds
            setTimeout(() => {
                const container = document.getElementById('paypal-button-container');
                const iframes = container.querySelectorAll('iframe');
                console.log('Container HTML:', container.innerHTML);
                console.log('Found iframes:', iframes.length);
                iframes.forEach((iframe, index) => {
                    console.log(`Iframe ${index} src:`, iframe.src);
                    console.log(`Iframe ${index} styles:`, getComputedStyle(iframe));
                });
            }, 2000);

        };
        script.onerror = (e) => {
            console.error('Failed to load PayPal SDK:', e);
            document.getElementById('paypal-button-container').innerHTML = '<p style="color: red;">Failed to load PayPal SDK</p>';
        };
        document.head.appendChild(script);
    </script>
</body>
</html></content>
